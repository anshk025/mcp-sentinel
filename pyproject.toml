[project]
name = "mcp-sentinel"
version = "0.1.0"
description = "⚡ The Automated Dynamic Security Scanner & Linter for Model Context Protocol (MCP) Servers and AI Agents"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Ansh K🕊️", email = "ansh.kumar19025@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.2.0",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
mcp-sentinel = "sentinel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]
